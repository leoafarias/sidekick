name: Build (Linux, Mac OS, Windows)

on:
  push:
    branches: [main]

jobs:
  build-linux:
    name: "Build Linux"
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev squashfs-tools

      - name: Enable desktop
        run: flutter config --enable-linux-desktop

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Flutter build app
        run: flutter build linux

      - name: Compress artifacts
        uses: TheDoctor0/zip-release@0.6.1
        with:
          filename: linux-dev.zip

      - name: Upload Build Zip
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-linux-dev.zip
          path: linux-dev.zip

      - name: Install appbuilder deps
        run: |
          sudo add-apt-repository universe
          sudo apt install libfuse2 libgtk-3-0

      - name: Install appimagebuilder
        run: |
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml

      - name: Upload Build AppImage
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-linux-dev.AppImage
          path: Sidekick-latest-x86_64.AppImage

  build-macos:
    name: "Build MacOS"
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Set Up XCode
        uses: BoundfoxStudios/action-xcode-select@v1

      - name: Enable desktop
        run: flutter config --enable-macos-desktop

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Flutter build app
        run: flutter build macos

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create dmg
        run: |
          ./scripts/create_mac_dmg.sh

      - name: Compress artifacts
        run: zip -r macos-dev.zip build/macos/Build/Products/Release

      - name: Upload Build DMG
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-macos-dev.dmg
          path: build/macos/Build/Products/Release/Sidekick.dmg

      - name: Upload Build Zip
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-macos-dev.zip
          path: macos-dev.zip

  build-windows:
    name: "Build Windows"
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Enable desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # SignTool rejects the committed SIDEKICK-CERT.pfx, so dev builds are signed
      # with a throwaway self-signed certificate generated for each run.
      - name: Create dev signing certificate
        run: |
          $password = [guid]::NewGuid().ToString()
          echo "::add-mask::$password"
          echo "DEV_CERT_PASS=$password" >> $env:GITHUB_ENV
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Sidekick Contributors" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(7)
          Export-PfxCertificate -Cert $cert -FilePath windows\dev-cert.pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText)

      - name: Write MSIX
        uses: DamianReeves/write-file-action@v1.0
        with:
          path: pubspec.yaml
          contents: |
            msix_config:
              display_name: Sidekick DEV Build
              publisher_display_name: Eduardo M.
              identity_name: SidekickContributors.SidekickFlutterDEV
              msix_version: 1.0.0.0
              logo_path: assets\promo-windows\icon.png
              architecture: x64
              capabilities: "internetClient,removableStorage"
              certificate_path: windows\dev-cert.pfx
              certificate_password: ${{ env.DEV_CERT_PASS }}
              install_certificate: false
              build_windows: false
              store: false
          write-mode: append

      - name: Write MS Store
        uses: DamianReeves/write-file-action@v1.0
        with:
          path: lib/src/modifiers.dart
          contents: |
            // Generated file. Do not modify
            const isMSStore = false;
          write-mode: overwrite

      - name: Flutter build app
        run: flutter build windows

      - name: Create MSIX
        run: dart run msix:create

      - name: Compress artifacts
        run: tar.exe -a -c -f windows-dev.zip build/windows/x64/runner/Release

      - name: Upload Build MSIX
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows-dev.msix
          path: build/windows/x64/runner/Release/sidekick.msix

      - name: Upload Build Zip
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows-dev.zip
          path: windows-dev.zip
