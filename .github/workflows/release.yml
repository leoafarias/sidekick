on:
  release:
    types:
      - created
  # Rebuilds the installers of an existing release, e.g. after a failed run
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. 1.2.0"
        required: true

name: Release Artifacts

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-linux:
    name: "Build Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Enable desktop
        run: flutter config --enable-linux-desktop

      - name: Install Cider
        run: flutter pub global activate cider

      - name: Set new Flutter version
        run: cider version "$TAG"

      - name: Set desktop entry and snap versions
        run: |
          echo "Version=$TAG" >> Sidekick.desktop
          echo "Version=$TAG" >> snap/gui/sidekick.desktop
          echo "version: \"$TAG\"" >> snap/snapcraft.yaml

      - name: Set release changelog
        run: cider release

      - name: Flutter get packages
        run: flutter pub get

      - name: Build Runner & version
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter build app
        run: flutter build linux

      - name: Compress artifacts
        uses: TheDoctor0/zip-release@0.6.1
        with:
          filename: linux-${{ env.TAG }}.zip

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: linux-${{ env.TAG }}.zip
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Install appbuilder deps
        run: |
          sudo add-apt-repository universe
          sudo apt install libfuse2 libgtk-3-0

      - name: Install appimagebuilder
        run: |
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml

      - name: Upload AppImage to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Sidekick-latest-x86_64.AppImage
          asset_name: sidekick-linux-${{ env.TAG }}.AppImage
          tag: ${{ env.TAG }}
          overwrite: true

  build-macos:
    name: "Build MacOS"
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Set Up XCode
        uses: BoundfoxStudios/action-xcode-select@v1

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Enable desktop
        run: flutter config --enable-macos-desktop

      - name: Install Cider
        run: flutter pub global activate cider

      - name: Set new Flutter version
        run: cider version "$TAG"

      - name: Set release changelog
        run: cider release

      - name: Flutter get packages
        run: flutter pub get

      - name: Build Runner & version
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter build app
        run: flutter build macos

      # The tag being built can predate the packaging scripts, so take them
      # from the workflow's own commit
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          path: release-tools
          sparse-checkout: scripts

      # Signs and notarizes when the Apple secrets are set
      - name: Sign, notarize and package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./release-tools/scripts/package_mac_release.sh "macos-$TAG.zip"

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: macos-${{ env.TAG }}.zip
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Upload DMG to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/macos/Build/Products/Release/Sidekick.dmg
          asset_name: sidekick-macos-${{ env.TAG }}.dmg
          tag: ${{ env.TAG }}
          overwrite: true

  build-windows-msstore:
    name: "Build Windows for MS Store"
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Enable desktop
        run: flutter config --enable-windows-desktop

      - name: Install Cider
        run: flutter pub global activate cider

      - name: Set new Flutter version
        run: cider version ${{ env.TAG }}

      - name: Set release changelog
        run: cider release

      # The Store signs the package itself, so the identity must match the
      # one reserved in Partner Center and no certificate is used
      - name: Write MSIX config
        shell: bash
        run: |
          cat >> pubspec.yaml <<EOF
          msix_config:
            display_name: Sidekick
            publisher_display_name: Eduardo M.
            identity_name: 44484EduardoM.SidekickFlutter
            publisher: CN=1E781C91-227E-4505-B5B8-7E5EFE39D3A6
            msix_version: $(echo "$TAG" | sed -E 's/[-+].*//').0
            logo_path: assets\promo-windows\icon.png
            architecture: x64
            capabilities: "internetClient,removableStorage"
            store: true
            build_windows: false
          EOF

      - name: Write MS Store true
        shell: bash
        run: |
          cat > lib/src/modifiers.dart <<EOF
          // Generated file. Do not modify
          const isMSStore = true;
          EOF

      - name: Flutter get packages
        run: flutter pub get

      - name: Build Runner & version
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter build app
        run: flutter build windows

      - name: Create MSIX
        run: dart run msix:create

      - name: Upload MSIX to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/windows/x64/runner/Release/sidekick.msix
          asset_name: sidekick-windows-${{ env.TAG }}-MS-NS.msix
          tag: ${{ env.TAG }}
          overwrite: true

      # TODO: Upload automatically to MS Store. MSFT is having some issues with their Azure AD so cannot be done yet.

  build-windows-standard:
    name: "Build Windows standard"
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.6.1
        with:
          channel: "stable"

      - name: Enable desktop
        run: flutter config --enable-windows-desktop

      - name: Install Cider
        run: flutter pub global activate cider

      - name: Set new Flutter version
        run: cider version ${{ env.TAG }}

      - name: Set release changelog
        run: cider release

      # Signed with the same self-signed certificate as the dev builds. Its
      # public part (sidekick-windows.cer) is attached to the release so
      # users can trust it before installing.
      - name: Write signing certificate
        shell: bash
        env:
          WIN_DEV_CERT_PFX: ${{ secrets.WIN_DEV_CERT_PFX }}
        run: echo "$WIN_DEV_CERT_PFX" | base64 --decode > windows/release-cert.pfx

      # No publisher, so msix reads it from the certificate
      - name: Write MSIX config
        shell: bash
        env:
          WIN_DEV_CERT_PASS: ${{ secrets.WIN_DEV_CERT_PASS }}
        run: |
          cat >> pubspec.yaml <<EOF
          msix_config:
            display_name: Sidekick
            publisher_display_name: Eduardo M.
            identity_name: SidekickContributors.SidekickFlutter
            msix_version: $(echo "$TAG" | sed -E 's/[-+].*//').0
            logo_path: assets\promo-windows\icon.png
            architecture: x64
            capabilities: "internetClient,removableStorage"
            certificate_path: windows\release-cert.pfx
            certificate_password: $WIN_DEV_CERT_PASS
            signtool_options: "/v /td SHA256"
            store: false
            install_certificate: false
            build_windows: false
          EOF

      - name: Flutter get packages
        run: flutter pub get

      - name: Build Runner & version
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter build app
        run: flutter build windows

      - name: Create MSIX
        run: dart run msix:create

      - name: Compress artifacts
        run: tar.exe -a -c -f windows-${{ env.TAG }}.zip build/windows/x64/runner/Release

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: windows-${{ env.TAG }}.zip
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Upload MSIX to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/windows/x64/runner/Release/sidekick.msix
          asset_name: sidekick-windows-${{ env.TAG }}.msix
          tag: ${{ env.TAG }}
          overwrite: true

      - name: Upload certificate to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: windows/sidekick-dev.cer
          asset_name: sidekick-windows.cer
          tag: ${{ env.TAG }}
          overwrite: true
